# fly.toml app configuration file generated for cadence-cal on 2026-10-27T14:02:06-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cadence-cal'
primary_region = 'sjc'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1

[env]
  FORWARDED_ALLOW_IPS = '*'