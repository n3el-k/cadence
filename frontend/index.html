<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <title>Cadence</title>
  <script data-goatcounter="https://neel-k.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <header class="topbar">
    <h1>Cadence</h1>
  </header>

  <main class="layout">
    <section class="calendar-card">
      <div id="calendar"></div>
    </section>

    <aside class="side">
      <div id="pending" class="pending" hidden></div>

      <section class="card">
        <label class="label" for="text-area">Add or change an event</label>
        <textarea id="text-area" rows="3" placeholder="Dinner with Sam on Friday at 7pm"></textarea>
        <p id="mode-note" class="mode-note"></p>
        <div id="chips" class="chips" hidden></div>

        <div class="row">
          <div class="mode">
            <input type="radio" id="command-btn" name="api-select" value="command" checked>
            <label for="command-btn">Quick</label>
            <input type="radio" id="agent-btn" name="api-select" value="agent">
            <label for="agent-btn">Agent</label>
          </div>
          <button id="send-btn" class="primary">Send</button>
        </div>
      </section>
      <button id="clear-btn">Clear Events</button>
      <section id="agent-output" class="card" hidden></section>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
